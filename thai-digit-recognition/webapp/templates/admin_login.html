{% extends "base.html" %}
{% block title %}Admin Login - Thai Digit AI{% endblock %}

{% block extra_head %}
<style>
  .login-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: calc(100vh - 120px);
  }
  .login-card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 2.5rem 2rem;
  }
  .login-header { text-align: center; margin-bottom: 2rem; }
  .login-header .icon { font-size: 3rem; }
  .login-header h2 { font-size: 1.4rem; font-weight: 700; margin-top: .5rem; }
  .login-header p { color: var(--muted); font-size: .9rem; margin-top: .25rem; }
</style>
{% endblock %}

{% block content %}
<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="icon">🔐</div>
      <h2>Admin Login</h2>
      <p>เข้าสู่ระบบสำหรับผู้ดูแล</p>
    </div>

    <form method="POST" action="{{ url_for('admin_login') }}">
      <div class="form-group">
        <label class="form-label" for="username">ชื่อผู้ใช้</label>
        <input type="text" id="username" name="username" class="form-control"
               placeholder="กรอกชื่อผู้ใช้" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">รหัสผ่าน</label>
        <input type="password" id="password" name="password" class="form-control"
               placeholder="กรอกรหัสผ่าน" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary"
              style="width:100%;justify-content:center;margin-top:.5rem;">
        🔑 เข้าสู่ระบบ
      </button>
    </form>

    <p style="text-align:center;margin-top:1.5rem;font-size:.85rem;color:var(--muted);">
      Default: admin / admin1234
    </p>
  </div>
</div>
{% endblock %}
